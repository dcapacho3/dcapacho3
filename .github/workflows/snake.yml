name: GitHub Snake Game


on:

  # Schedule the workflow to run daily at 00:05 Bogota time

  schedule:

    - cron: "5 5 * * *"



  # Allow manual triggering of the workflow

  workflow_dispatch:



  # Trigger the workflow on pushes to the main branch

  push:

    branches:

      - main



jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 10



    steps:

      # Step 1: Checkout the repository

      - name: Checkout Repository

        uses: actions/checkout@v3



      # Step 2: Generate the snake animations

      - name: Generate GitHub Contributions Snake Animations

        uses: Platane/snk@v3

        with:

          # GitHub username to generate the animation for

          github_user_name: ${{ github.repository_owner }}



          # Define the output files and their configurations

          outputs: |

            dist/github-snake.svg

            dist/github-snake-dark.svg?palette=github-dark

            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      # Step 3: Streak card, counted in Bogota time, private repos included
      - name: Build streak card
        run: |
          sudo chown -R "$USER" dist
          python3 .github/streak.py dist/streak.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      # Step 4: Stats and languages card, private repos included
      - name: Build stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          filename: dist/stats.svg
          output_action: none
          base: header, repositories
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_other: yes

      # Step 5: Deploy the generated files to the 'output' branch

      - name: Deploy to Output Branch

        uses: peaceiris/actions-gh-pages@v3

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./dist

          publish_branch: output

          # Optionally, you can set a custom commit message

          commit_message: "Update snake animation [skip ci]"
